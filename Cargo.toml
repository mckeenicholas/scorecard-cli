[package]
name = "fast-scorecard-gen"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
printpdf = "0.12.8"
lopdf = { version = "0.44.0", default-features = false }
rayon = "1.12.0"
ureq = { version = "3", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
flate2 = { version = "1.1.10", features = ["zlib-ng"], default-features = false }
mimalloc = { version = "0.1.52", default-features = false }
itoa = "1.0.18"
rustc-hash = "2.1.3"
indicatif = "0.18.6"
inquire = "0.9.4"
crossterm = "0.29.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
